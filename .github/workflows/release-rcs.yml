name: Release RCS Docker Image

on:
  push:
    tags:
      - 'rcs-v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/remote-control-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, 2026-04-25

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3, 2026-04-25
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3, 2026-04-25

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#rcs-v}" >> "$GITHUB_OUTPUT"

      - name: Generate tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAGS="${IMAGE}:${VERSION}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          if [ -n "$MAJOR" ] && [ -n "$MINOR" ]; then
            TAGS="${TAGS},${IMAGE}:${MAJOR}.${MINOR}"
          fi
          TAGS="${TAGS},${IMAGE}:latest"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5, 2026-04-25
        with:
          context: .
          file: packages/remote-control-server/Dockerfile
          push: false
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          IMAGE_TAG=$(echo "$IMAGE_TAGS" | cut -d',' -f1)
          TOKEN_PEPPER=$(openssl rand -hex 32)
          WORKER_JWT_SECRET=$(openssl rand -hex 32)
          docker run -d --name rcs-test -p 3000:3000 \
            -e RCS_TOKEN_PEPPER="$TOKEN_PEPPER" \
            -e RCS_WORKER_JWT_SECRET="$WORKER_JWT_SECRET" \
            "$IMAGE_TAG"
          # Bounded retry instead of a fixed sleep: startup time varies with
          # runner load, so one shot after 5s is both flaky and slower than it
          # needs to be.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health >/dev/null; then
              echo "health endpoint responded after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "health endpoint did not respond within 30s"
              docker logs rcs-test
              exit 1
            fi
            sleep 1
          done
          docker stop rcs-test
          docker rm rcs-test

      - name: Push Docker image
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          IFS=',' read -ra TAGS <<< "$IMAGE_TAGS"
          for TAG in "${TAGS[@]}"; do
            docker push "$TAG"
          done
