name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (例如: v1.9.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, 2026-04-25
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6, 2026-04-25
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, 2026-04-25
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck

      - name: Run release-surface tests
        # The full unit suite is CI's job and is currently order-dependent on
        # Linux (pre-existing Bun mock/env pollution — ~10 files fail under the
        # runner's file ordering; tracked separately). The release gates on the
        # contract tests that pin the published surface: cli-golden (command/flag
        # table via the real CLI) and headless-ndjson (wire format), plus the
        # typecheck/build/check:bundle/boot-smoke steps around this one.
        run: bun test tests/integration

      # Build once here so the artifact can be smoke-tested BEFORE npm publish
      # re-builds it via prepublishOnly. check:bundle catches broken chunk links
      # and Node-incompatible imports; the two --version runs prove both entry
      # points actually boot. This is the "installed CLI starts reliably" gate.
      - name: Build and smoke-test dist
        run: |
          bun run build:vite
          bun run check:bundle
          node dist/cli-node.js --version
          bun dist/cli-bun.js --version

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate changelog
        id: changelog
        env:
          # Interpolate via env, not inline in run: — workflow_dispatch input is
          # maintainer-supplied but still shell-unsafe when spliced into commands.
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          # Prefer the hand-written CHANGELOG.md section, so the Release body is
          # the same text the in-app "what's new" feed shows. The version is
          # passed as argv (quoted), never spliced into a command string, and the
          # extracted notes only ever reach the shell as a quoted variable.
          NOTES=$(bun run scripts/changelog-section.ts "$VERSION" || true)

          if [ -z "$NOTES" ]; then
            echo "No CHANGELOG.md section for ${VERSION}; falling back to commit list."
            PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION#v}$" | head -1)

            if [ -n "$PREV_TAG" ]; then
              NOTES=$(git log "${PREV_TAG}..${VERSION}" --pretty=format:"- %s (%h)" --no-merges)
            else
              NOTES=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
            fi
          fi

          {
            echo "commits<<CHANGELOG_EOF"
            printf '%s\n' "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2, 2026-04-25
        with:
          name: ${{ github.event.inputs.version || github.ref_name }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.commits }}

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ github.event.inputs.version || github.ref_name }}^...${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.event.inputs.version || github.ref_name, 'rc') || contains(github.event.inputs.version || github.ref_name, 'beta') || contains(github.event.inputs.version || github.ref_name, 'alpha') }}
